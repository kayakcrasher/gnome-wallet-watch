[project]
name = "gnome-wallet-watch"
version = "0.2.0"
description = "Web app to inspect any Solana wallet: SOL balance, SPL tokens, recent txs."
authors = [{ name = "GNOMEFINANCE" }]
requires-python = ">=3.10"
dependencies = [
    "solana>=0.34.0",
    "solders>=0.21.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "jinja2>=3.1.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
gnome-watch = "gnome_wallet_watch.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
gnome_wallet_watch = ["templates/*.html", "static/*"]
