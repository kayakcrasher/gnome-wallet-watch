[project]
name = "gnome-wallet-watch"
version = "0.1.0"
description = "A simple CLI to inspect any Solana wallet: SOL balance, SPL tokens, recent txs."
authors = [{ name = "GNOMEFINANCE" }]
requires-python = ">=3.10"
dependencies = [
    "solana>=0.34.0",
    "solders>=0.21.0",
    "typer>=0.12.0",
    "python-dotenv>=1.0.0",
    "rich>=13.0.0",
]

[project.scripts]
gnome-watch = "gnome_wallet_watch.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
